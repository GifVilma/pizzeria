<!DOCTYPE html>
<html lang="es-EC">
<head>
{{ROBOTS}}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="{{DESCRIPTION}}">
  <title>{{TITLE}}</title>
  {{CANONICAL}}
  <meta property="og:type" content="{{OG_TYPE}}">
  <meta property="og:locale" content="es_EC">
  <meta property="og:site_name" content="La Buona Pizza Alausí">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{URL}}">
  <meta property="og:image" content="{{IMAGE}}">
  <meta property="og:image:width" content="{{IMAGE_WIDTH}}">
  <meta property="og:image:height" content="{{IMAGE_HEIGHT}}">
  <meta property="og:image:alt" content="{{IMAGE_ALT}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{IMAGE}}">
  <meta name="twitter:image:alt" content="{{IMAGE_ALT}}">
  {{JSON_LD}}

  <!-- Favicon -->
  <link rel="icon" href="{{ICON}}" type="{{ICON_TYPE}}" sizes="64x64">

  <!-- Bootstrap 4 CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

  <!-- FontAwesome Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <!-- Fuentes Google: Raleway y Lora -->
  <link href="https://fonts.googleapis.com/css?family=Raleway:100,100i,200,200i,300,300i,400,400i,500,500i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Lora:400,400i,700,700i" rel="stylesheet">

  <!-- Hoja de Estilos del Tema Business Casual -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="{{PAGE}}">

  <!-- Encabezado / Título Principal -->
  <div class="site-heading text-center text-white">
    <span class="site-heading-upper text-primary mb-3">Il gusto autentico d'Italia</span>
    <span class="site-heading-lower">La Buona Pizza Alausí</span>
  </div>

  <!-- Navegación Principal (#mainNav) -->
  <nav class="navbar navbar-expand-lg navbar-dark py-lg-4" id="mainNav">
    <div class="container">
      <a class="navbar-brand text-uppercase text-expanded font-weight-bold d-lg-none" href="/">La Buona Pizza Alausí</a>
      <button id="menu-toggle" class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarResponsive">
        <ul class="navbar-nav mx-auto" id="navbar-links">
          <li class="nav-item px-lg-4 {{ACTIVE_HOME}}">
            <a class="nav-link text-uppercase text-expanded" href="/">Inicio</a>
          </li>
          <li class="nav-item px-lg-4 {{ACTIVE_PIZZAS}}">
            <a class="nav-link text-uppercase text-expanded" href="/pizzas/">Nuestras Pizzas</a>
          </li>
          <li class="nav-item px-lg-4 {{ACTIVE_COMBOS}}">
            <a class="nav-link text-uppercase text-expanded" href="/combos/">Combos</a>
          </li>
          <li class="nav-item px-lg-4 {{ACTIVE_BLOG}}">
            <a class="nav-link text-uppercase text-expanded" href="/blog/">Blog</a>
          </li>
          <li class="nav-item px-lg-4 {{ACTIVE_RESENAS}}">
            <a class="nav-link text-uppercase text-expanded" href="/resenas/">Reseñas</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Área de Contenido Principal Dinámico -->
  <main id="app-content" tabindex="-1">
{{CONTENT}}
  </main>

  <!-- Pie de Página (#site-footer) -->
  <footer class="footer text-faded text-center py-5" id="site-footer">
    <div class="container">
      <p class="m-0 mbt">
        <a href="https://www.facebook.com/profile.php?id=61593925504990" target="_blank" rel="noopener noreferrer" class="link" aria-label="Facebook"><i class="fa fa-facebook fa-2x mx-2" aria-hidden="true"></i></a>
        <a href="https://www.instagram.com/labuo.napizza/" target="_blank" rel="noopener noreferrer" class="link" aria-label="Instagram de La Buona Pizza Alausí"><i class="fa fa-instagram fa-2x mx-2" aria-hidden="true"></i></a>
      </p>
      <p class="m-0 mbt1 small">
        Copyright &copy; La Buona Pizza Alausí 2026
      </p>
    </div>
  </footer>

  <button id="back-to-top" class="back-to-top" type="button" aria-label="Volver arriba" hidden>
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M12 19V5M5 12l7-7 7 7"></path>
    </svg>
  </button>

  <!-- Scripts Auxiliares -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script Controlador JS -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
